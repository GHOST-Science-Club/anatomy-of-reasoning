input: data/thinkarm/traces.jsonl
labeler: basal
model: Remek/basal-2.0-4.5B  # Recorded only; the server decides which model runs.
base_url: http://localhost:8000  # basal-serve address (no /v1).
batch_size: 20  # Same as configs/llm.yaml, so both labelers see the same context.
concurrency: 8  # Requests in flight; each carries batch_size questions.
traces_in_flight: 4
guidebook: ThinkARM/guidebook/sentence_guide.md  # Same guidebook as the LLM.
criteria: src/labeling/prompts/basal.md  # Per-sentence question ({index}) and label criteria.
