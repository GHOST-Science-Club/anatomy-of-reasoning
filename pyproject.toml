[project]
name = "anatomy-of-reasoning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6",
    "python-dotenv>=1",
    "google-genai>=2.34.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.45.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
    "wordcloud>=1.9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labeling"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
