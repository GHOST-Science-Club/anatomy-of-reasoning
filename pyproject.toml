[project]
name = "anatomy-of-reasoning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6",
    "python-dotenv>=1",
    "google-genai>=2.34.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.45.0",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17",
    "wordcloud>=1.9.6",
]

[project.optional-dependencies]
# basal-serve on an NVIDIA GPU (driver for CUDA 12.8+): uv sync --extra basal
basal = ["basal[fp8]", "torch==2.11.0"]

[tool.uv.sources]
basal = { url = "https://github.com/rkinas/basal/archive/refs/tags/v2.5.3.tar.gz" }
torch = { index = "pytorch-cu128", extra = "basal" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labeling"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["ThinkARM"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B905"]
